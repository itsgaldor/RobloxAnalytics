<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Marca no encontrada — Peru City Analytics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <link rel="shortcut icon" href="/dashboard/images/logo.png">
  <link rel="stylesheet" href="/dashboard/css/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/dashboard/css/font-awesome/css/font-awesome.min.css" />
  <link rel="stylesheet" href="/dashboard/css/ionicons/css/ionicons.min.css" />
  <link rel="stylesheet" href="/dashboard/css/styles/app.css" />
  <link rel="stylesheet" href="/dashboard/css/pca.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #f5f7fa;
    }
    .error-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .error-icon {
      font-size: 5rem;
      color: #ccc;
      margin-bottom: 1rem;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 700;
      color: #dee2e6;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: #495057;
      margin-bottom: 0.5rem;
    }
    .error-slug {
      display: inline-block;
      background: #f1f3f5;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      padding: 2px 10px;
      font-family: monospace;
      font-size: 1rem;
      color: #6c757d;
      margin-bottom: 1.5rem;
    }
    .error-desc {
      color: #6c757d;
      max-width: 400px;
      margin-bottom: 2rem;
    }
    .btn-back {
      display: inline-block;
      padding: 10px 28px;
      background: #6C3ADE;
      color: #fff;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn-back:hover {
      background: #5530b8;
      color: #fff;
      text-decoration: none;
    }
    .footer-note {
      margin-top: 3rem;
      color: #adb5bd;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

<div class="error-wrap">
  <div class="error-icon">
    <i class="ion-ios-analytics"></i>
  </div>

  <div class="error-code">404</div>

  <p class="error-title">Marca no encontrada</p>

  <span class="error-slug" id="slug-display"></span>

  <p class="error-desc">
    La marca que buscás no existe en Peru City Analytics
    o todavía no tiene datos configurados.
  </p>

  <a href="/dashboard/?brand=demo" class="btn-back">
    <i class="fa fa-arrow-left"></i>&nbsp; Ver demo
  </a>

  <p class="footer-note">
    Peru City Analytics &mdash; Si creés que esto es un error,
    verificá el slug en la URL o contactá al administrador.
  </p>
</div>

<script>
  // Mostrar el slug que causó el error (extraído de ?brand=)
  (function () {
    var params = new URLSearchParams(window.location.search);
    var brand  = params.get('brand');
    var el     = document.getElementById('slug-display');
    if (el && brand) {
      el.textContent = brand;
    } else if (el) {
      el.style.display = 'none';
    }
    if (brand) {
      document.title = '"' + brand + '" no encontrada — Peru City Analytics';
    }
  })();
</script>

</body>
</html>
