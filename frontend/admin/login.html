<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peru City Analytics — Admin</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232d3e50'/><text y='.9em' font-size='70' x='15'>📊</text></svg>">
  <link rel="stylesheet" href="/dashboard/css/ionicons/css/ionicons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #1e2d3d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .login-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .login-logo {
      width: 56px;
      height: 56px;
      background: #2d3e50;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .login-logo i {
      font-size: 28px;
      color: #ffffff;
    }

    .login-title {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-title h4 {
      font-size: 18px;
      font-weight: 600;
      color: #1e2d3d;
      margin-bottom: 4px;
    }

    .login-title p {
      font-size: 13px;
      color: #64748b;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #475569;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      color: #1e293b;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .form-control:focus {
      border-color: #2d3e50;
      box-shadow: 0 0 0 3px rgba(45,62,80,0.12);
      background: #ffffff;
    }

    .form-control::placeholder {
      color: #94a3b8;
    }

    .btn-login {
      width: 100%;
      padding: 11px;
      margin-top: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #ffffff;
      background: #2d3e50;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-login:hover {
      background: #1e2d3d;
    }

    .btn-login:active {
      transform: scale(0.99);
    }

    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #dc2626;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="login-card">

    <div class="login-logo">
      <i class="ion-ios-analytics"></i>
    </div>

    <div class="login-title">
      <h4>Peru City Analytics</h4>
      <p>Acceso al backoffice</p>
    </div>

    <div class="alert-error" id="login-error">
      <i class="ion-alert-circled"></i>
      Usuario o contraseña incorrectos
    </div>

    <form method="POST" action="/api/v1/auth/login">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-control"
          placeholder="admin"
          autocomplete="username"
          required
          autofocus
        >
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        >
      </div>
      <button type="submit" class="btn-login">
        <i class="ion-log-in"></i>
        Ingresar
      </button>
    </form>

  </div><!-- /login-box -->

</body>
</html>
